'use strict';const BANK=[{"id":1,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Tính đến năm 2024 (theo SGK), nước ta có bao nhiêu dân tộc cùng sinh sống?","options":["50 dân tộc.","54 dân tộc.","58 dân tộc.","60 dân tộc."],"correct":1,"explanation":"Việt Nam là quốc gia thống nhất gồm 54 dân tộc cùng sinh sống."},{"id":2,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Dân tộc Kinh có đặc điểm nào về quy mô dân số ở Việt Nam?","options":["Là dân tộc có số dân đông nhất.","Chỉ cư trú ở vùng núi cao.","Có số dân ít hơn từng dân tộc thiểu số.","Chỉ sinh sống tại các đô thị."],"correct":0,"explanation":"Người Kinh là dân tộc đông dân nhất, chiếm phần lớn dân số Việt Nam (SGK trang 117)."},{"id":3,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Các dân tộc thiểu số của nước ta có đặc điểm phân bố nào sau đây?","options":["Chỉ cư trú ở đồng bằng sông Hồng.","Cư trú chủ yếu ở miền núi và cao nguyên, đồng thời có mặt ở nhiều nơi.","Chỉ sống ở các đảo ven bờ.","Phân bố hoàn toàn đồng đều giữa các vùng."],"correct":1,"explanation":"Các dân tộc thiểu số cư trú nhiều ở miền núi, cao nguyên và phân bố ở nhiều vùng khác (trang 117)."},{"id":4,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Dân tộc Kinh cư trú tập trung chủ yếu ở những vùng địa hình nào sau đây?","options":["Đồng bằng, ven biển và trung du.","Núi cao và cao nguyên.","Miền núi phía Bắc và Tây Nguyên.","Các vùng biên giới phía Bắc."],"correct":0,"explanation":"Người Kinh sinh sống chủ yếu ở đồng bằng, ven biển và trung du."},{"id":5,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Các dân tộc thiểu số như Tày, H'Mông, Thái, Mường cư trú chủ yếu ở khu vực nào?","options":["Tây Nguyên.","Trung du và miền núi phía Bắc.","Đồng bằng sông Cửu Long.","Duyên hải Nam Trung Bộ."],"correct":1,"explanation":"Tày, H’Mông, Thái, Mường là các dân tộc cư trú nhiều tại Trung du và miền núi phía Bắc."},{"id":6,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Các dân tộc thiểu số như Gia-rai, Ê-đê, Ba-na tập trung cư trú chủ yếu ở vùng nào?","options":["Đồng bằng sông Hồng.","Bắc Trung Bộ.","Duyên hải Nam Trung Bộ và Tây Nguyên.","Đông Nam Bộ."],"correct":2,"explanation":"Gia-rai, Ê-đê, Ba-na phân bố chủ yếu tại Duyên hải Nam Trung Bộ và Tây Nguyên."},{"id":7,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Theo SGK năm 2024, bộ phận người Việt Nam sinh sống, làm việc và học tập ở nước ngoài là hơn bao nhiêu?","options":["3 triệu người.","4 triệu người.","5 triệu người.","6 triệu người."],"correct":2,"explanation":"Trong SGK, cộng đồng người Việt Nam ở nước ngoài được nêu là hơn 5 triệu người."},{"id":8,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Theo SGK (Bảng 1.1), quy mô dân số nước ta năm 2024 đạt bao nhiêu triệu người?","options":["76,5 triệu người.","86,0 triệu người.","96,5 triệu người.","101,3 triệu người."],"correct":3,"explanation":"Bảng 1.1 cho biết dân số nước ta năm 2024 là 101,3 triệu người."},{"id":9,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Quy mô dân số lớn tạo thuận lợi chủ yếu nào cho phát triển kinh tế nước ta?","options":["Làm cho mọi vùng có mật độ dân số bằng nhau.","Làm giảm nhu cầu giải quyết việc làm.","Cung cấp nguồn lao động và thị trường tiêu thụ rộng lớn.","Xóa bỏ sự chênh lệch giữa thành thị và nông thôn."],"correct":2,"explanation":"Dân số đông tạo nguồn lao động dồi dào và thị trường tiêu thụ rộng, đồng thời đặt ra sức ép về việc làm (trang 118)."},{"id":10,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Trong khu vực Đông Nam Á, dân số Việt Nam đứng thứ mấy (sau In-đô-nê-xi-a và Phi-líp-pin)?","options":["Thứ nhất.","Thứ hai.","Thứ ba.","Thứ tư."],"correct":2,"explanation":"Ở Đông Nam Á, Việt Nam xếp sau In-đô-nê-xi-a và Phi-líp-pin về số dân."},{"id":11,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Tỉ lệ tăng dân số nước ta giai đoạn 1999 – 2024 theo Bảng 1.1 trong SGK có xu hướng biến đổi như thế nào?","options":["Tăng nhanh liên tục.","Có xu hướng giảm.","Giữ nguyên không đổi.","Biến động tăng đột biến."],"correct":1,"explanation":"Bảng 1.1 thể hiện tỉ lệ tăng dân số có xu hướng giảm theo thời gian."},{"id":12,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Dựa vào Bảng 1.1, nhận xét nào đúng về số dân và tỉ lệ tăng dân số Việt Nam giai đoạn 1999–2024?","options":["Số dân giảm, tỉ lệ tăng liên tục tăng.","Số dân và tỉ lệ tăng luôn bằng nhau.","Số dân không đổi, tỉ lệ tăng giảm về 0.","Số dân tăng, còn tỉ lệ tăng dân số nhìn chung giảm."],"correct":3,"explanation":"Số dân tăng từ 76,5 lên 101,3 triệu người, nhưng tỉ lệ tăng dân số nhìn chung giảm (trang 118)."},{"id":13,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Mặc dù tỉ lệ tăng dân số có xu hướng giảm, trung bình mỗi năm dân số nước ta vẫn tăng thêm khoảng bao nhiêu người?","options":["500 nghìn người.","1 triệu người.","1,5 triệu người.","2 triệu người."],"correct":1,"explanation":"Dù tốc độ gia tăng giảm, quy mô dân số lớn khiến dân số tăng thêm khoảng 1 triệu người mỗi năm."},{"id":14,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Dựa vào Bảng 1.2, tỉ trọng nhóm tuổi dưới 15 ở nước ta giai đoạn 1999–2024 thay đổi theo hướng nào?","options":["Giảm.","Tăng liên tục.","Không thay đổi.","Tăng gấp đôi."],"correct":0,"explanation":"Tỉ trọng nhóm tuổi dưới 15 giảm từ 33,1% năm 1999 còn 23,3% năm 2024 (trang 119)."},{"id":15,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Tỉ trọng người từ 65 tuổi trở lên tăng cho thấy xu hướng dân số nào ở nước ta?","options":["Trẻ hóa dân số.","Già hóa dân số.","Giảm tuổi thọ bình quân.","Dân số giảm tuyệt đối."],"correct":1,"explanation":"Tỉ trọng người cao tuổi tăng phản ánh xu hướng già hóa dân số (trang 119)."},{"id":16,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Nhóm tuổi nào chiếm tỉ trọng lớn nhất trong cơ cấu dân số nước ta năm 2024?","options":["Dưới 15 tuổi.","Từ 65 tuổi trở lên.","Từ 15 đến 64 tuổi.","Các nhóm tuổi bằng nhau."],"correct":2,"explanation":"Nhóm 15–64 tuổi có tỉ trọng lớn nhất trong ba nhóm tuổi (Bảng 1.2, trang 119)."},{"id":17,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Khái niệm \"Cơ cấu dân số vàng\" trong SGK được xác định khi bình quân 1 người phụ thuộc thì có mấy người trong tuổi lao động?","options":["1 người.","2 người.","3 người.","4 người."],"correct":1,"explanation":"Cơ cấu dân số vàng: bình quân một người phụ thuộc có ít nhất hai người trong độ tuổi lao động."},{"id":18,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Biểu hiện nào dưới đây phù hợp với quá trình già hóa dân số?","options":["Tỉ trọng trẻ em dưới 15 tuổi tăng nhanh.","Tỉ trọng người cao tuổi tăng.","Dân số không còn tăng.","Tất cả người lao động đều trên 65 tuổi."],"correct":1,"explanation":"Già hóa dân số biểu hiện rõ ở sự gia tăng tỉ trọng người cao tuổi (trang 119)."},{"id":19,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Thách thức nào thường gia tăng khi dân số chuyển sang xu hướng già hóa?","options":["Nhu cầu chăm sóc sức khỏe và an sinh cho người cao tuổi.","Không còn nhu cầu đào tạo lao động.","Mọi vùng đều thiếu đất nông nghiệp.","Số trẻ em chắc chắn tăng nhanh."],"correct":0,"explanation":"Già hóa dân số đặt ra yêu cầu về chăm sóc sức khỏe, an sinh và thích ứng nguồn lao động (liên hệ kiến thức trang 119)."},{"id":20,"topic":"BÀI 1: DÂN TỘC VÀ DÂN SỐ VIỆT NAM","q":"Dựa vào Hình 1.1, nhận xét đúng về tỉ số giới tính của dân số nước ta giai đoạn 1999–2024 là gì?","options":["Giảm đều qua các năm.","Luôn cao hơn 120 nam/100 nữ.","Không thay đổi.","Có xu hướng tiến gần mức cân bằng giữa nam và nữ."],"correct":3,"explanation":"Tỉ số giới tính tăng từ 96,4 lên 99,6 nam/100 nữ, tiến gần mức cân bằng (trang 119)."},{"id":21,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Theo SGK, mật độ dân số trung bình của nước ta năm 2024 là bao nhiêu người/km²?","options":["250 người/km².","306 người/km².","350 người/km².","410 người/km²."],"correct":1,"explanation":"Mật độ dân số trung bình cả nước năm 2024 là 306 người/km²."},{"id":22,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Mật độ dân số Việt Nam so với mức trung bình thế giới có đặc điểm nào?","options":["Thấp hơn nhiều.","Cao hơn nhiều.","Bằng nhau.","Không thể so sánh."],"correct":1,"explanation":"SGK trang 120 cho biết mật độ dân số nước ta cao, khoảng 5 lần mức trung bình thế giới."},{"id":23,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Nhận xét nào đúng về mật độ dân số Việt Nam trong khu vực Đông Nam Á?","options":["Thuộc nhóm nước có mật độ dân số cao.","Thấp nhất khu vực.","Bằng tất cả các nước trong khu vực.","Thấp hơn mức trung bình thế giới."],"correct":0,"explanation":"Việt Nam là nước có mật độ dân số cao ở Đông Nam Á (trang 120)."},{"id":24,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Vùng nào có mật độ dân số cao nhất cả nước năm 2024 (1 034 người/km²)?","options":["Đông Nam Bộ.","Đồng bằng sông Hồng.","Đồng bằng sông Cửu Long.","Duyên hải Nam Trung Bộ."],"correct":1,"explanation":"Đồng bằng sông Hồng là vùng có mật độ dân số cao nhất theo bảng số liệu nêu trong SGK."},{"id":25,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Vùng nào có mật độ dân số thấp nhất cả nước năm 2024 (chỉ 136 người/km²)?","options":["Tây Nguyên.","Trung du và miền núi phía Bắc.","Bắc Trung Bộ.","Đồng bằng sông Cửu Long."],"correct":1,"explanation":"Trung du và miền núi phía Bắc có mật độ dân số thấp nhất theo số liệu bài học."},{"id":26,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Năm 2024, dân cư nước ta tập trung ở khu vực nào nhiều hơn?","options":["Thành thị.","Nông thôn.","Hai khu vực bằng nhau.","Chỉ tập trung ở các đảo."],"correct":1,"explanation":"Dân cư nông thôn vẫn chiếm tỉ trọng lớn hơn thành thị (trang 120)."},{"id":27,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Tỉ lệ dân thành thị nước ta từ năm 1990 đến năm 2024 có xu hướng nào?","options":["Giảm liên tục.","Không thay đổi.","Tăng lên.","Luôn cao hơn tỉ lệ dân nông thôn."],"correct":2,"explanation":"Tỉ lệ dân thành thị tăng từ 19,5% năm 1990 lên 38,5% năm 2024 (trang 120)."},{"id":28,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Những vùng kinh tế phát triển năng động thu hút đông dân cư ở nước ta được nêu trong SGK là?","options":["Tây Nguyên và Bắc Trung Bộ.","Đông Nam Bộ và Đồng bằng sông Hồng.","Trung du và miền núi phía Bắc và Đông Nam Bộ.","Đồng bằng sông Cửu Long và Tây Nguyên."],"correct":1,"explanation":"Đông Nam Bộ và Đồng bằng sông Hồng là hai vùng có kinh tế năng động, thu hút đông cư dân."},{"id":29,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Hai loại hình quần cư chính ở nước ta được nêu trong bài là gì?","options":["Quần cư du cư và quần cư định cư.","Quần cư nông thôn và quần cư thành thị.","Quần cư đồng bằng và quần cư miền núi.","Quần cư ven biển và quần cư nội địa."],"correct":1,"explanation":"Ở nước ta có hai loại hình quần cư chủ yếu: nông thôn và thành thị."},{"id":30,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Cấu trúc đơn vị cư trú của quần cư nông thôn ở nước ta thường gồm những gì?","options":["Xã, thôn, xóm, bản,...","Phường, tổ dân phố,...","Đô thị, thị xã, thị trấn,...","Quận, huyện, thành phố,..."],"correct":0,"explanation":"Quần cư nông thôn thường tổ chức thành xã, thôn, xóm, bản và các đơn vị tương tự."},{"id":31,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Hoạt động kinh tế chủ yếu của cư dân trong quần cư nông thôn là ngành nào?","options":["Công nghiệp chế biến.","Nông nghiệp.","Dịch vụ thương mại.","Giao thông vận tải."],"correct":1,"explanation":"Nông nghiệp là hoạt động kinh tế chủ yếu truyền thống ở quần cư nông thôn."},{"id":32,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Quần cư thành thị nước ta có đơn vị cư trú được cấu trúc thành gì?","options":["Thôn, làng, ấp, bản.","Phường, tổ dân phố,...","Hợp tác xã sản xuất.","Trang trại kinh tế."],"correct":1,"explanation":"Quần cư thành thị được tổ chức theo phường, tổ dân phố và các đơn vị tương tự."},{"id":33,"topic":"BÀI 2: PHÂN BỐ DÂN CƯ VÀ CÁC LOẠI HÌNH QUẦN CƯ","q":"Ngành kinh tế chủ ỏ lẻ phân tán trong hộ gia đình.","Ứng dụng công nghệ cao, sản xuất theo quy mô công nghiệp tập trung, chăn nuôi bền vững.","Giảm tối đa quy mô đàn vật nuôi.","Chỉ tập trung phát triển chăn nuôi trâu, bò."],"correct":1,"explanation":"Phát triển nông nghiệp hướng tới sản xuất hàng hóa hiện đại, hiệu quả và bền vững."}];
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');const W=1600,H=900;
const T={ink:'#153d66',navy:'#184a81',blue:'#2389e7',green:'#1ba976',pink:'#ed568b',orange:'#ffab3b',violet:'#8065d6'};
let scene='home',pool=[],index=0,score=0,chosen=-1,finished=false,optionOrder=[],hits=[],silent=false,audioCtx=null,category='all',randomQuestions=false,lock=false;
const palettes=[['#e3f7ff','#c8eaff'],['#e6fce9','#bbf2cf'],['#fff2dc','#ffe3b3'],['#f6e8ff','#e5d0ff']];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function rounded(x,y,w,h,r,fill,stroke=null,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function text(s,x,y,size=32,color=T.ink,weight=700,align='left'){ctx.font=`${weight} ${size}px Tahoma, Arial, sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitLines(s,maxWidth,size,maxLines=10){ctx.font=`700 ${size}px Tahoma, Arial, sans-serif`;let words=String(s).split(/\s+/),res=[],line='';for(const word of words){const tryLine=line?line+' '+word:word;if(ctx.measureText(tryLine).width>maxWidth&&line){res.push(line);line=word}else line=tryLine}if(line)res.push(line);return res.slice(0,maxLines)}
function paragraph(s,x,y,w,size,lineH,color=T.ink,maxLines=10,weight=700){ctx.font=`${weight} ${size}px Tahoma, Arial, sans-serif`;let words=String(s).split(/\s+/),lines=[],line='';for(const word of words){let t=line?line+' '+word:word;if(ctx.measureText(t).width>w&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='top';ctx.font=`${weight} ${size}px Tahoma, Arial, sans-serif`;lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));return Math.min(lines.length,maxLines)*lineH}
function bg(){const grd=ctx.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#e6f8ff');grd.addColorStop(.55,'#f5faff');grd.addColorStop(1,'#fff2dd');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.24;[['#70ddc8',70,750,290],['#79aef5',1490,130,290],['#ffcf8b',1390,830,240],['#e9afff',260,100,170]].forEach(([c,x,y,r])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function pill(x,y,w,h,label,fill='#fff',color=T.ink,font=27){rounded(x,y,w,h,h/2,fill);text(label,x+w/2,y+h/2,font,color,800,'center')}
function button(x,y,w,h,label,fill='#fff',color=T.ink,handler=()=>{},font=32){rounded(x,y+5,w,h,22,'#264e7130');rounded(x,y,w,h,22,fill);text(label,x+w/2,y+h/2,font,color,800,'center');hits.push({x,y,w,h,handler})}
function header(title,sub){pill(80,55,285,56,'🌍  ĐỊA LÍ 9','#fff','#217ec1',27);text(title,80,165,62,T.navy,900);text(sub,82,224,29,'#527999',600)}
function drawHome(){header('THỬ THÁCH TRI THỨC','80 câu hỏi • 4 bài học • Tự chấm điểm • Giải thích đáp án');rounded(80,274,1440,525,35,'#ffffffde','#d7e9f5');text('CHỌN NỘI DUNG',130,330,36,T.ink,900);const groups=[['BÀI 1','Dân tộc và dân số',1],['BÀI 2','Phân bố dân cư',2],['BÀI 3','Lao động và việc làm',3],['BÀI 5','Nông nghiệp',5]];groups.forEach((g,i)=>{let x=130+(i%2)*690,y=373+Math.floor(i/2)*105;button(x,y,650,84,`${g[0]}  ·  ${g[1]}`,palettes[i][0],T.ink,()=>start(g[2]),26)});button(130,606,650,86,'🎯  TRỘN CẢ 80 CÂU','#278de7','#fff',()=>start('all',true),30);button(820,606,650,86,'📚  LÀM 80 CÂU THEO BÀI','#1bb68a','#fff',()=>start('all',false),30);text('Mỗi bài 20 câu · Vị trí đáp án được xáo trộn ở từng câu',133,747,25,'#587891',500)}
function start(cat,mix=false){category=cat;randomQuestions=mix;pool=BANK.filter(q=>cat==='all'||q.topic.startsWith('BÀI '+cat+':'));if(mix)pool=shuffle(pool);index=0;score=0;chosen=-1;scene='quiz';initQuestion();render()}
function initQuestion(){chosen=-1;finished=false;optionOrder=shuffle([0,1,2,3]);lock=false}
function sound(good){if(silent)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;let notes=good?[550,770,1030]:[290,230];notes.forEach((v,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=v;o.connect(g);g.connect(audioCtx.destination);let t=now+i*.12;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.16,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.20);o.start(t);o.stop(t+.21)})}catch(e){}}
function choose(displayIndex){if(chosen!==-1)return;chosen=displayIndex;if(optionOrder[displayIndex]===pool[index].correct)score++;sound(optionOrder[displayIndex]===pool[index].correct);render()}
function next(){if(scene==='end'){scene='home';render();return}if(scene!=='quiz')return;if(chosen===-1)return;if(index===pool.length-1){scene='end';render();return}index++;initQuestion();render()}
function drawQuiz(){let q=pool[index],progress=(index+1)/pool.length;rounded(68,37,1464,81,27,'#ffffffc9');text('🌍  THỬ THÁCH ĐỊA LÍ 9',98,79,29,T.blue,900);pill(760,55,370,46,q.topic.split(':')[0], '#e8f5ff',T.navy,25);pill(1160,55,175,46,`CÂU ${index+1}/${pool.length}`,'#fff1d9',T.ink,25);pill(1350,55,150,46,`⭐ ${score} điểm`,'#dff9e9','#16805c',23);
rounded(80,139,1440,13,8,'#d5e8ef');rounded(80,139,Math.max(12,1440*progress),13,8,'#1cbf95');
rounded(80,179,1440,215,30,'#fff','#d7eaf5');pill(116,202,155,43,'CÂU HỎI','#e8f2ff','#326da6',22);
const qsize=q.q.length>155?37:q.q.length>105?41:47;const lines=fitLines(q.q,1320,qsize);const lineH=qsize+14;paragraph(q.q,117,263,1350,qsize,lineH,T.ink,3,700);
const cells=[[80,413],[815,413],[80,561],[815,561]];cells.forEach(([x,y],i)=>{let real=optionOrder[i],good=real===q.correct,selected=chosen===i;let colors=palettes[i],fill=colors[0],border='#cae0e9';if(chosen!==-1){if(good){fill='#d2f8e3';border='#18a573'}else if(selected){fill='#ffe0e0';border='#e45862'}}rounded(x,y,705,127,24,'#57748c20');rounded(x,y-4,705,127,24,fill,border,3);rounded(x+22,y+26,70,70,22,chosen!==-1&&good?'#11a76c':['#28a2df','#18af83','#fc9947','#9a7bea'][i]);text(['A','B','C','D'][i],x+57,y+61,36,'#fff',900,'center');let opt=q.options[real];let fs=opt.length>104?24:opt.length>75?27:opt.length>49?30:35;const n=fitLines(opt,570,fs).length;paragraph(opt,x+109,y+57-Math.min(n,3)*(fs+4)/2,564,fs,fs+5,T.ink,3,700);if(chosen!==-1&&good)text('✓',x+658,y+18,34,'#108c61',900,'center');if(chosen!==-1&&selected&&!good)text('✕',x+658,y+18,34,'#d74b50',900,'center');if(chosen===-1)hits.push({x,y:y-4,w:705,h:127,handler:()=>choose(i)})});
if(chosen===-1){pill(80,733,1070,96,'CHỌN ĐÁP ÁN ĐỂ XEM GIẢI THÍCH', '#ffffffc9','#47728e',27);button(1170,733,350,96,'Đang trả lời…','#d9e9f2','#6890a5',()=>{},26)}else{let good=optionOrder[chosen]===q.correct;rounded(80,726,1080,134,24,good?'#d7f9e7':'#fff0dc',good?'#36b685':'#efb263',2);text(good?'✓  CHÍNH XÁC!':'✕  CHƯA ĐÚNG',108,757,26,good?'#117e58':'#ad5b31',900);paragraph(q.explanation,108,795,1010,24,30,T.ink,2,700);button(1180,744,340,94,index===pool.length-1?'XEM KẾT QUẢ  →':'CÂU TIẾP  →','#208ae6','#fff',()=>next(),30)}}
function drawEnd(){header('HOÀN THÀNH THỬ THÁCH!','Kết quả được tính dựa trên số câu trả lời đúng');rounded(185,290,1230,510,40,'#ffffffdc','#d7eaf7');text(`${score} / ${pool.length}`,800,400,112,T.blue,900,'center');text(`Đạt ${Math.round(score/pool.length*100)}% câu trả lời chính xác`,800,505,39,T.ink,800,'center');let remark=score===pool.length?'Xuất sắc! Hoàn thành trọn vẹn.':score/pool.length>=.8?'Rất tốt! Kiến thức vững vàng.':score/pool.length>=.6?'Khá tốt! Hãy ôn thêm các số liệu.':'Hãy thử lại để củng cố kiến thức.';text(remark,800,575,30,'#52738b',600,'center');button(245,654,520,92,'🔄  CHƠI LẠI','#20aa80','#fff',()=>start(category,randomQuestions),31);button(835,654,520,92,'⌂  CHỌN BÀI KHÁC','#258ee7','#fff',()=>{scene='home';render()},31)}
function render(){hits=[];ctx.clearRect(0,0,W,H);bg();if(scene==='home')drawHome();else if(scene==='quiz')drawQuiz();else drawEnd()}
canvas.addEventListener('pointerdown',e=>{let b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;for(let i=hits.length-1;i>=0;i--){let h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.handler();break}}});
window.addEventListener('keydown',e=>{if(scene==='quiz'){if(chosen===-1&&/^[1-4]$/.test(e.key))choose(Number(e.key)-1);else if(chosen!==-1&&e.key==='Enter')next()}else if(scene==='end'&&e.key==='Enter'){scene='home';render()}});
document.getElementById('sound').onclick=()=>{silent=!silent;document.getElementById('sound').textContent=silent?'🔇 Tắt tiếng':'🔊 Âm thanh'};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.getElementById('stage').requestFullscreen?.()}else document.exitFullscreen?.()};
render();
